name: Recover keep-market-dev

on:
  push:
    branches: [recover/keep-market-dev]

env:
  KEEP_MARKET_BOT: keep-market
  AZURE_RESOURCE_GROUP: rg-dfx-api-dev
  AZURE_STORAGE_ACCOUNT_NAME: stdfxapidev
  AZURE_WORKSPACE_NAME: log-dfx-api-dev
  IMAGE_REF: dfxswiss/hummingbot@sha256:4d1dd268286510aac85edae49e9f4769bfba3721bcaff0fafedf45667b5f1210
  DEPLOY_INFO: recover-${{ github.ref_name }}-${{ github.sha }}

jobs:
  recover:
    name: Redeploy keep-market-dev with pinned amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.DFX_DEV_CREDENTIALS }}

      - name: Get Storage Key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --account-name ${{ env.AZURE_STORAGE_ACCOUNT_NAME }} \
            --query '[0].value' -o tsv)
          echo "STORAGE_KEY=$STORAGE_KEY" >> $GITHUB_ENV

      - name: Get Log Analytics Info
        run: |
          LOG_WORKSPACE_ID=$(az monitor log-analytics workspace show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ env.AZURE_WORKSPACE_NAME }} \
            --query customerId -o tsv)

          LOG_WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ env.AZURE_WORKSPACE_NAME }} \
            --query primarySharedKey -o tsv)
          echo "LOG_WORKSPACE_ID=$LOG_WORKSPACE_ID" >> $GITHUB_ENV
          echo "LOG_WORKSPACE_KEY=$LOG_WORKSPACE_KEY" >> $GITHUB_ENV

      - name: Render deployment YAML for keep-market
        uses: nowactions/envsubst@v1
        with:
          input: ./aci-keep-market-dev.yaml
          output: ./rendered-aci-keep-market-dev.yaml
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          DEPLOY_INFO: ${{ env.DEPLOY_INFO }}
          STORAGE_KEY: ${{ env.STORAGE_KEY }}
          LOG_WORKSPACE_ID: ${{ env.LOG_WORKSPACE_ID }}
          LOG_WORKSPACE_KEY: ${{ env.LOG_WORKSPACE_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Stop Azure Container Instance
        run: |
          az container stop --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ci-dfx-hb-${{ env.KEEP_MARKET_BOT }}-dev || true

      - name: Delete Azure Container Instance
        run: |
          az container delete --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ci-dfx-hb-${{ env.KEEP_MARKET_BOT }}-dev --yes || true

      - name: Deploy container instance
        run: |
          az container create --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --file ./rendered-aci-keep-market-dev.yaml

      - name: Logout from Azure
        run: az logout
        if: always()
