name: Hummingbot DEV CI/CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  DOCKER_IMAGE: dfxswiss/hummingbot
  DOCKER_TAG: beta

jobs:
  build-and-publish:
    name: Build and publish image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Notify server repo (image published)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          if [ -z "$DISPATCH_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::warning::DISPATCH_REPO or DISPATCH_TOKEN not configured — skipping deploy notification"
            exit 0
          fi
          gh api "repos/$DISPATCH_REPO/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=${{ env.DOCKER_IMAGE }}" \
            -f "client_payload[sha]=${{ github.sha }}"
